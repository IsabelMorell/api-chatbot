
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prestamo-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: prestamo-streamlit
    ports:
      - "8502:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
